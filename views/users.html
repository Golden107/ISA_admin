<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行政管理系統 | 權限管理</title>
    <style>
        /* 沿用大廳的視覺變數與基本排版 */
        :root {
            --primary-color: #0F4C81;
            --sidebar-bg: #FFFFFF;
            --bg-color: #F4F7F6;
            --text-main: #333;
            --border-color: #E2E8F0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            display: flex;
            background: var(--bg-color);
            min-height: 100vh;
            color: var(--text-main);
        }

        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
        }

        .sidebar h2 {
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .menu-item {
            display: block;
            padding: 12px 15px;
            text-decoration: none;
            color: #555;
            border-radius: 6px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .menu-item:hover,
        .menu-item.active {
            background: var(--primary-color);
            color: #fff;
        }

        .main-content {
            flex: 1;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .data-table th,
        .data-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            background: #F8FAFC;
            color: #64748B;
            font-weight: 600;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 4px;
            color: #fff;
        }

        .btn-add {
            background: #38A169;
            padding: 10px 20px;
        }

        .btn-edit {
            background: #3182CE;
        }

        .btn-delete {
            background: #E53E3E;
        }

        /* 表單燈箱樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            background: #fff;
            width: 400px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: #CBD5E0;
            color: #333;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <h2>行政管理系統</h2>
        <a href="/dashboard" class="menu-item">申請大廳</a>
        <a href="/apply" class="menu-item">新增表單申請</a>
        <a href="/users" class="menu-item active" id="menu-users">權限管理 (資安長專用)</a>
        <a href="#" class="menu-item" onclick="logout()" style="color:#E53E3E; margin-top: 20px;">登出系統</a>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>系統權限管理</h1>
            <div>當前使用者：<span id="userName" style="font-weight:bold; color:var(--primary-color);">載入中...</span></div>
        </div>

        <div class="section-title">
            <span>使用者名單</span>
            <button class="btn btn-add" onclick="openModal()">＋ 新增使用者</button>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>姓名</th>
                    <th>登入信箱(帳號)</th>
                    <th>系統權限</th>
                    <th>操作選項</th>
                </tr>
            </thead>
            <tbody id="userList">
                <tr>
                    <td colspan="5" style="text-align:center;">載入中...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <div id="userModal" class="modal-overlay">
        <div class="modal-container">
            <h2 id="modalTitle" style="margin-bottom: 20px; color: var(--primary-color);">新增使用者</h2>
            <form id="userForm">
                <input type="hidden" id="editUserId">
                <div class="form-group">
                    <label>員工姓名</label>
                    <input type="text" id="u_name" required placeholder="例如：王小明">
                </div>
                <div class="form-group">
                    <label>登入信箱 (帳號)</label>
                    <input type="email" id="u_email" required placeholder="例如：staff@company.com">
                </div>
                <div class="form-group">
                    <label>登入密碼 <span id="pwdHint"
                            style="font-size:0.8rem; font-weight:normal; color:#888;"></span></label>
                    <input type="password" id="u_password" placeholder="請輸入高強度密碼">
                </div>
                <div class="form-group">
                    <label>系統權限角色</label>
                    <select id="u_role" required>
                        <option value="EMPLOYEE">一般員工</option>
                        <option value="MANAGER">櫃檯主任</option>
                        <option value="DIRECTOR">管理部主任</option>
                        <option value="CISO">資安長</option>
                        <option value="PRINCIPAL">班主任</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-add">儲存設定</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const roleNames = {
            'EMPLOYEE': '一般員工', 'MANAGER': '櫃檯主任',
            'DIRECTOR': '管理部主任', 'CISO': '資安長', 'PRINCIPAL': '班主任'
        };

        // 🛡️ 頁面載入：強制身分驗證
        document.addEventListener('DOMContentLoaded', async () => {
            const userStr = localStorage.getItem('currentUser');
            if (!userStr) {
                alert('請先登入系統！');
                return window.location.href = '/';
            }
            const user = JSON.parse(userStr);

            // 如果不是資安長，直接踢回大廳
            if (user.role !== 'CISO') {
                alert('⚠️ 存取被拒！您沒有權限進入系統管理後台。');
                return window.location.href = '/dashboard';
            }

            document.getElementById('userName').textContent = `${user.name} (資安長)`;
            await loadUsers();
        });

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/';
        }

        // 呼叫 API 取用資料，附帶身分證明 (x-user-role)
        const fetchAPI = async (url, options = {}) => {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!options.headers) options.headers = {};
            options.headers['x-user-role'] = user.role; // 告訴後端我是資安長

            const response = await fetch(url, options);
            return response.json();
        };

        // 讀取列表
        async function loadUsers() {
            const tbody = document.getElementById('userList');
            try {
                const result = await fetchAPI('/api/users');
                if (result.success) {
                    tbody.innerHTML = '';
                    result.data.forEach(u => {
                        const tr = document.createElement('tr');
                        // 資安長不能刪除自己，做個保護
                        const actionHtml = u.role === 'CISO'
                            ? `<button class="btn btn-edit" onclick='openModal(${JSON.stringify(u)})'>編輯</button>`
                            : `<button class="btn btn-edit" onclick='openModal(${JSON.stringify(u)})'>編輯</button>
                               <button class="btn btn-delete" onclick="deleteUser(${u.id})">刪除</button>`;

                        tr.innerHTML = `
                            <td>${u.id}</td>
                            <td style="font-weight:bold;">${u.name}</td>
                            <td>${u.email}</td>
                            <td><span style="background:#E2E8F0; padding:4px 8px; border-radius:4px; font-size:0.9em;">${roleNames[u.role] || u.role}</span></td>
                            <td>${actionHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" style="color:red; text-align:center;">資料載入失敗</td></tr>';
            }
        }

        // 開啟燈箱 (若有傳入資料代表是「編輯」，沒有則是「新增」)
        function openModal(userData = null) {
            document.getElementById('userModal').classList.add('active');
            const form = document.getElementById('userForm');

            if (userData) {
                // 編輯模式
                document.getElementById('modalTitle').textContent = '編輯使用者';
                document.getElementById('editUserId').value = userData.id;
                document.getElementById('u_name').value = userData.name;
                document.getElementById('u_email').value = userData.email;
                document.getElementById('u_role').value = userData.role;
                document.getElementById('u_password').value = '';
                document.getElementById('u_password').removeAttribute('required');
                document.getElementById('pwdHint').textContent = '(若不修改密碼請留白)';
            } else {
                // 新增模式
                form.reset();
                document.getElementById('modalTitle').textContent = '新增使用者';
                document.getElementById('editUserId').value = '';
                document.getElementById('u_password').setAttribute('required', 'true');
                document.getElementById('pwdHint').textContent = '(必填)';
            }
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        // 送出表單 (新增 或 修改)
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editUserId').value;
            const payload = {
                name: document.getElementById('u_name').value,
                email: document.getElementById('u_email').value,
                password: document.getElementById('u_password').value,
                role: document.getElementById('u_role').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/users/${id}` : '/api/users';

            const result = await fetchAPI(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (result.success) {
                alert(result.message);
                closeModal();
                loadUsers();
            } else {
                alert('操作失敗：' + result.error);
            }
        });

        // 刪除使用者
        async function deleteUser(id) {
            if (!confirm('確定要刪除這位員工嗎？(請注意：若該員工有申請單紀錄，強行刪除可能會導致系統錯誤)')) return;
            const result = await fetchAPI(`/api/users/${id}`, { method: 'DELETE' });
            if (result.success) {
                alert('刪除成功');
                loadUsers();
            } else {
                alert('刪除失敗：' + result.error);
            }
        }
    </script>
</body>

</html>
