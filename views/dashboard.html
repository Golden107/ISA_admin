<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>補教行政系統 | 申請大廳</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #0F4C81;
            --sidebar-bg: #FFFFFF;
            --bg-color: #F4F7F6;
            --text-main: #333;
            --border-color: #E2E8F0;
            --status-pending: #D69E2E;
            --status-approved: #38A169;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            display: flex;
            background: var(--bg-color);
            min-height: 100vh;
            color: var(--text-main);
        }

        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
        }

        .sidebar h2 {
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .menu-item {
            display: block;
            padding: 12px 15px;
            text-decoration: none;
            color: #555;
            border-radius: 6px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .menu-item:hover,
        .menu-item.active {
            background: var(--primary-color);
            color: #fff;
        }

        .main-content {
            flex: 1;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .data-table th,
        .data-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            background: #F8FAFC;
            color: #64748B;
            font-weight: 600;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .badge.pending {
            background: #FEFCBF;
            color: var(--status-pending);
        }

        .badge.approved {
            background: #C6F6D5;
            color: var(--status-approved);
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 4px;
        }

        .btn-approve {
            background: var(--status-approved);
            color: #fff;
        }

        .btn-reject {
            background: #E53E3E;
            color: #fff;
        }

        .btn-view {
            background: #3182CE;
            color: #fff;
        }

        /* 燈箱樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-container {
            background: #fff;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(-20px);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal-container {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: bold;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .detail-row {
            margin-bottom: 12px;
            line-height: 1.5;
            border-bottom: 1px dashed #eee;
            padding-bottom: 10px;
        }

        .detail-label {
            font-weight: bold;
            color: #555;
            display: inline-block;
            width: 130px;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <h2>行政管理系統</h2>
        <a href="/dashboard" class="menu-item active">申請大廳</a>
        <a href="/apply" class="menu-item">新增表單申請</a>
        <a href="/users" class="menu-item" id="menu-users" style="display: none;">權限管理 (資安長專用)</a>
        <a href="#" class="menu-item" onclick="logout()" style="color:#E53E3E; margin-top: 20px;">登出系統</a>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>工作面板</h1>
            <div>當前使用者：<span id="userName" style="font-weight:bold; color:var(--primary-color);">載入中...</span></div>
        </div>

        <div class="chart-container"
            style="background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);">
            <h3 class="section-title">系統表單比例分佈</h3>
            <div style="position: relative; height: 250px; width: 100%;">
                <canvas id="typeChart"></canvas>
            </div>
        </div>

        <div id="allRecordsSection"
            style="display: none; background: #eef2f6; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
            <h3 class="section-title" style="color: var(--primary-color);">🏢 全公司申請單總覽 (高階主管專區)</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>單號</th>
                        <th>申請人</th>
                        <th>表單類型</th>
                        <th>申請日期</th>
                        <th>進度狀態</th>
                        <th>明細</th>
                    </tr>
                </thead>
                <tbody id="allRecordsList"></tbody>
            </table>
        </div>

        <div id="approvalSection">
            <h3 class="section-title">待我簽核的任務</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>單號</th>
                        <th>申請人</th>
                        <th>表單類型</th>
                        <th>申請日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="approvalList"></tbody>
            </table>
        </div>

        <h3 class="section-title">我的申請紀錄</h3>
        <table class="data-table">
            <thead>
                <tr>
                    <th>單號</th>
                    <th>表單類型</th>
                    <th>送出日期</th>
                    <th>目前進度</th>
                    <th>明細</th>
                </tr>
            </thead>
            <tbody id="myRecordsList"></tbody>
        </table>
    </main>

    <div id="detailModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">單據明細</div>
                <button class="btn-close" onclick="closeModal()">×</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // 💡 建立全域變數與中英文對照翻譯字典
        let allFormsData = {};

        const translateDict = {
            // 欄位名稱翻譯
            'payment_amount': '請款金額 (NT$)', 'payee_name': '受款人/廠商名稱', 'payment_reason': '請款事由說明', 'receipt_image': '收據/發票影像',
            'leave_type': '假別', 'substitute': '代理人', 'leave_start': '起始時間', 'leave_end': '結束時間', 'leave_reason': '請假事由',
            'document_name': '文件名稱', 'seal_type': '印信種類', 'seal_copies': '用印份數', 'seal_reason': '用印事由與文件摘要', 'document_file': '上傳文件電子檔',
            'item_name': '物品名稱', 'estimated_cost': '預估總金額 (NT$)', 'quantity': '數量', 'supplier_link': '參考網址/供應商', 'procurement_reason': '採購原因與規格說明',
            'withdraw_amount': '提領金額 (NT$)', 'withdraw_date': '預計提領日期', 'withdraw_reason': '提款用途說明',
            'copy_color': '影印類型', 'copy_pages': '總張數', 'project_class': '歸屬專案 / 班級',
            'data_target_type': '調閱對象類別', 'data_scope': '調閱範圍/條件', 'data_purpose': '調閱目的與用途', 'data_compliance': '同意資安規範',
            // 欄位內容值翻譯
            'annual': '特休/年假', 'sick': '病假', 'personal': '事假', 'official': '公假',
            'company': '公司大章', 'representative': '負責人小章', 'both': '大小章', 'contract': '合約專用章',
            'black_white': '黑白', 'color': '彩色',
            'student': '學生個資', 'parent': '家長個資', 'employee': '員工個資',
            'on': '是 / 已同意'
        };

        const t = (text) => translateDict[text] || text;

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const userStr = localStorage.getItem('currentUser');

            if (!userStr || userStr === 'undefined') {
                localStorage.removeItem('currentUser');
                window.location.href = '/';
                return;
            }

            const user = JSON.parse(userStr);

            const roleMapping = { 'EMPLOYEE': '一般員工', 'MANAGER': '單位主管', 'DIRECTOR': '管理部主任', 'CISO': '資安長', 'PRINCIPAL': '班主任' };
            document.getElementById('userName').textContent = `${user.name} (${roleMapping[user.role] || user.role})`;

            if (user.role === 'CISO') document.getElementById('menu-users').style.display = 'block';

            if (user.role === 'EMPLOYEE') document.getElementById('approvalSection').style.display = 'none';
            else await loadPendingForms(user.role);

            if (['PRINCIPAL', 'DIRECTOR', 'CISO'].includes(user.role)) {
                document.getElementById('allRecordsSection').style.display = 'block';
                await loadAllRecords(user.role);
            }

            await loadMyRecords(user.id);
            await loadChart();
        });

        async function loadChart() {
            try {
                const response = await fetch('/api/forms/stats');
                const result = await response.json();
                if (result.success && result.data.length > 0) {
                    new Chart(document.getElementById('typeChart').getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels: result.data.map(i => i.label),
                            datasets: [{ data: result.data.map(i => i.value), backgroundColor: ['#3182CE', '#E53E3E', '#D69E2E', '#38A169', '#805AD5'] }]
                        }
                    });
                }
            } catch (e) { console.error(e); }
        }

        async function loadPendingForms(role) {
            const tbody = document.getElementById('approvalList');
            const response = await fetch(`/api/forms/pending/${role}`);
            const result = await response.json();
            if (result.success) {
                tbody.innerHTML = result.data.length ? '' : '<tr><td colspan="5" style="text-align:center;">目前無任務</td></tr>';
                result.data.forEach(form => {
                    allFormsData[form.application_id] = form; // 存入總資料庫
                    tbody.innerHTML += `<tr><td>#${form.application_id}</td><td>${form.applicant_name}</td><td>${form.form_type_name}</td><td>${new Date(form.created_at).toLocaleDateString('zh-TW')}</td><td><button class="btn btn-view" onclick="openModal(${form.application_id})">查看</button><button class="btn btn-approve" onclick="reviewForm(${form.application_id}, 'APPROVE')">核准</button><button class="btn btn-reject" onclick="reviewForm(${form.application_id}, 'REJECT')">駁回</button></td></tr>`;
                });
            }
        }

        async function loadAllRecords(userRole) {
            const tbody = document.getElementById('allRecordsList');
            try {
                const response = await fetch(`/api/forms/all-records`, { headers: { 'x-user-role': userRole } });
                const result = await response.json();

                if (result.success) {
                    tbody.innerHTML = result.data.length === 0 ? '<tr><td colspan="6" style="text-align:center;">目前無任何申請紀錄</td></tr>' : '';
                    const statusMap = { 'PENDING': '<span class="badge pending">簽核中</span>', 'APPROVED': '<span class="badge approved">已結案</span>', 'REJECTED': '<span class="badge" style="background:#FED7D7; color:#C53030;">被駁回</span>' };
                    const stepMap = { 1: '單位主管', 2: '管理部主任', 3: '資安長', 4: '班主任' };

                    result.data.forEach(form => {
                        allFormsData[form.application_id] = form; // 存入總資料庫
                        let progressText = form.status === 'PENDING' ? ` (卡在: ${stepMap[form.current_step] || '完成'})` : '';
                        tbody.innerHTML += `
                            <tr>
                                <td>#${form.application_id}</td>
                                <td style="font-weight:bold;">${form.applicant_name}</td>
                                <td>${form.form_type_name}</td>
                                <td>${new Date(form.created_at).toLocaleDateString('zh-TW')}</td>
                                <td>${statusMap[form.status]} ${progressText}</td>
                                <td><button class="btn btn-view" onclick="openModal(${form.application_id})">看內容</button></td>
                            </tr>
                        `;
                    });
                }
            } catch (err) { console.error("無法載入總表", err); }
        }

        async function loadMyRecords(userId) {
            const tbody = document.getElementById('myRecordsList');
            try {
                const response = await fetch(`/api/forms/my-records/${userId}`);
                const result = await response.json();

                if (result.success) {
                    tbody.innerHTML = result.data.length === 0 ? '<tr><td colspan="5" style="text-align:center;">目前無申請紀錄</td></tr>' : '';
                    const statusMap = { 'PENDING': '<span class="badge pending">簽核中</span>', 'APPROVED': '<span class="badge approved">已核准</span>', 'REJECTED': '<span class="badge" style="background:#FED7D7; color:#C53030;">已駁回</span>' };

                    result.data.forEach(record => {
                        allFormsData[record.application_id] = record; // 存入總資料庫
                        tbody.innerHTML += `
                            <tr>
                                <td>#${record.application_id}</td>
                                <td>${record.form_type_name}</td>
                                <td>${new Date(record.created_at).toLocaleDateString('zh-TW')}</td>
                                <td>${statusMap[record.status] || record.status}</td>
                                <td><button class="btn btn-view" onclick="openModal(${record.application_id})">看內容</button></td>
                            </tr>
                        `;
                    });
                }
            } catch (err) { console.error("無法載入申請紀錄", err); }
        }

        // 💡 視覺化燈箱與翻譯邏輯
        function openModal(id) {
            const form = allFormsData[id];
            if (!form) return;

            document.getElementById('modalTitle').textContent = `申請單明細 #${form.application_id}`;
            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            // --- 繪製進度條 (動態計算通過關卡) ---
            const steps = ['單位主管', '管理部主任', '資安長', '班主任'];
            let progressHtml = `
            <div style="margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px dashed #E2E8F0;">
                <div style="font-weight: bold; margin-bottom: 15px; color: var(--primary-color);">表單簽核進度：</div>
                <div style="display:flex; justify-content:space-between; text-align:center; position: relative;">
                    <div style="position: absolute; top: 12px; left: 10%; right: 10%; height: 2px; background: #E2E8F0; z-index: 1;"></div>`;

            steps.forEach((stepName, index) => {
                let stepNum = index + 1;
                let statusColor = '#A0AEC0'; // 預設灰 (未到)
                let icon = '⏳';

                if (form.status === 'REJECTED' && form.current_step === stepNum) {
                    statusColor = '#E53E3E'; icon = '❌'; // 駁回點
                } else if (form.status === 'APPROVED' || form.current_step > stepNum) {
                    statusColor = '#38A169'; icon = '✅'; // 已通過
                } else if (form.status === 'PENDING' && form.current_step === stepNum) {
                    statusColor = '#D69E2E'; icon = '✍️'; // 當前卡關
                }

                progressHtml += `
                    <div style="z-index: 2; background: #fff; padding: 0 5px; color: ${statusColor}; font-weight: bold; font-size: 0.85rem;">
                        <div style="font-size: 1.2rem;">${icon}</div>
                        <div style="margin-top: 5px;">第${stepNum}關<br>${stepName}</div>
                    </div>`;
            });
            progressHtml += `</div></div>`;
            body.innerHTML += progressHtml;

            // --- 繪製翻譯後的表單內容 ---
            try {
                // 如果後端尚未補上 a.content，這裡會產生 undefined 錯誤，用 catch 捕捉
                if (!form.content) throw new Error("無表單內容資料");

                const content = JSON.parse(form.content);
                for (let key in content) {
                    // 跳過系統隱藏欄位
                    if (key === 'formType' || key === 'userId') continue;

                    let displayKey = t(key);
                    let displayVal = t(content[key]);

                    if (typeof content[key] === 'string' && content[key].startsWith('/uploads/')) {
                        body.innerHTML += `<div class="detail-row"><span class="detail-label">${displayKey}：</span><a href="${content[key]}" target="_blank" style="color:var(--primary-color); font-weight:bold;">📄 [點此預覽附件]</a></div>`;
                    } else {
                        body.innerHTML += `<div class="detail-row"><span class="detail-label">${displayKey}：</span>${displayVal}</div>`;
                    }
                }
            } catch (e) {
                body.innerHTML += `<div class="detail-row" style="color:red;">請確認後端已更新 API 以回傳表單內容 (a.content)。</div>`;
            }

            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal() { document.getElementById('detailModal').classList.remove('active'); }

        async function reviewForm(id, action) {
            const actionText = action === 'APPROVE' ? '核准' : '駁回';
            if (!confirm(`確定要「${actionText}」這張表單嗎？`)) return;

            const userStr = localStorage.getItem('currentUser');
            if (!userStr) return;
            const user = JSON.parse(userStr);

            const comment = prompt(`請輸入簽核意見 (${actionText}):`, action === 'APPROVE' ? "同意" : "");
            if (comment === null) return;

            try {
                const response = await fetch(`/api/forms/${id}/review`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: action,
                        comment: comment || '',
                        approverId: user.id
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert(result.message);

                    loadPendingForms(user.role);
                    if (['PRINCIPAL', 'DIRECTOR', 'CISO'].includes(user.role)) {
                        loadAllRecords(user.role);
                    }
                    loadMyRecords(user.id);

                } else {
                    alert("簽核失敗：" + result.error);
                }
            } catch (err) {
                console.error(err);
                alert("系統連線異常，簽核失敗");
            }
        }    
    </script>
</body>

</html>
