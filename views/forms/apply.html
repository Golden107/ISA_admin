<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學達文理補習班行政簽核系統 | 填寫表單</title>
    <style>
        :root { --primary-color: #0F4C81; --bg-color: #F8FAFC; --card-bg: #FFFFFF; --text-main: #334155; --text-light: #64748B; --border-color: #E2E8F0; --input-focus: #BAE6FD; --radius-md: 8px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; display: flex; justify-content: center; }
        .form-container { background-color: var(--card-bg); width: 100%; max-width: 600px; padding: 30px; border-radius: var(--radius-md); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .form-header { border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; }
        .form-header h2 { color: var(--primary-color); font-size: 1.5rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; transition: all 0.3s; }
        .form-control:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--input-focus); }
        .dynamic-fields { background-color: #F8FAFC; padding: 20px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .btn-submit { width: 100%; padding: 14px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .btn-submit:hover { background-color: #165b99; }
        .btn-back { display: inline-block; padding: 10px 15px; margin-bottom: 20px; background-color: #E2E8F0; color: #333; text-decoration: none; border-radius: 6px; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>

<body>
    <div>
        <a href="/dashboard" class="btn-back">⬅ 返回首頁</a>
        <div class="form-container">
            <div class="form-header">
                <h2>建立新申請單</h2>
                <p style="color: var(--text-light); font-size: 0.9rem; margin-top: 5px;">請選擇表單類型並填寫相關明細</p>
            </div>

            <form id="applyForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="formTypeSelector">表單類型</label>
                    <select id="formTypeSelector" class="form-control" required onchange="renderFormFields()">
                        <option value="" disabled selected>請選擇申請項目</option>
                        <option value="payment">請款申請單</option>
                        <option value="leave">請假申請單</option>
                        <option value="seal">用印申請單</option>
                        <option value="procurement">採購申請單</option>
                        <option value="cash_withdraw">現金提領申請單</option>
                        <option value="copy_record">影印登記表</option>
                        <option value="data_access">個資調閱申請單</option>
                    </select>
                </div>

                <div id="dynamicFieldsContainer" class="dynamic-fields" style="display: none;"></div>
                <button type="submit" class="btn-submit" id="submitBtn">送出申請單 ➔</button>
            </form>
        </div>
    </div>

    <script>
        const formTemplates = {
            payment: `
                <div class="form-group"><label>請款金額 (NT$)</label><input type="number" name="payment_amount" class="form-control" required min="1"></div>
                <div class="form-group"><label>受款人/廠商名稱</label><input type="text" name="payee_name" class="form-control" required></div>
                <div class="form-group"><label>請款事由說明</label><textarea name="payment_reason" class="form-control" rows="3" required></textarea></div>
            `,
            leave: `
                <div class="form-group"><label>假別</label><select name="leave_type" class="form-control" required><option value="annual">特休</option><option value="sick">病假</option><option value="personal">事假</option><option value="official">公假</option></select></div>
                <div class="form-group">
                    <label>職務代理人 (必選)</label>
                    <select name="substitute_info" id="substituteSelect" class="form-control" required>
                        <option value="">讀取名單中...</option>
                    </select>
                </div>
                <div class="form-group"><label>開始時間</label><input type="datetime-local" name="leave_start" class="form-control" required></div>
                <div class="form-group"><label>結束時間</label><input type="datetime-local" name="leave_end" class="form-control" required></div>
                <div class="form-group"><label>請假事由</label><textarea name="leave_reason" class="form-control" rows="3" required></textarea></div>
                <div class="form-group"><label>證明文件 (選填)</label><input type="file" name="proof_file" class="form-control" accept="image/*,.pdf"></div>
            `,
            seal: `
                <div class="form-group"><label>文件名稱</label><input type="text" name="document_name" class="form-control" required></div>
                <div class="form-group"><label>申請印信種類</label><select name="seal_type" class="form-control" required><option value="company">補習班官印</option><option value="representative">班主任私章</option><option value="both">公司一般大小章</option><option value="contract">班主任職名章</option><option value="sign">班主任簽字章</option></select></div>
                <div class="form-group"><label>用印份數</label><input type="number" name="seal_copies" class="form-control" required min="1"></div>
                <div class="form-group"><label>用印事由</label><textarea name="seal_reason" class="form-control" rows="3" required></textarea></div>
                <div class="form-group"><label>文件電子檔</label><input type="file" name="document_file" class="form-control" accept=".pdf,.doc,.docx" required></div>
            `,
            procurement: `
                <div class="form-group"><label>申購物品名稱</label><input type="text" name="item_name" class="form-control" required></div>
                <div class="form-group"><label>預估單價 (NT$)</label><input type="number" name="estimated_cost" class="form-control" required min="1"></div>
                <div class="form-group"><label>數量</label><input type="number" name="quantity" class="form-control" required min="1"></div>
                <div class="form-group"><label>申購原因</label><textarea name="procurement_reason" class="form-control" rows="3" required></textarea></div>
                <div class="form-group"><label>參考報價單 (選填)</label><input type="file" name="quote_file" class="form-control" accept="image/*,.pdf"></div>
            `,
            cash_withdraw: `
                <div class="form-group"><label>提領金額 (NT$)</label><input type="number" name="withdraw_amount" class="form-control" required min="1"></div>
                <div class="form-group"><label>預計提領日期</label><input type="date" name="withdraw_date" class="form-control" required></div>
                <div class="form-group"><label>資金用途說明</label><textarea name="withdraw_reason" class="form-control" rows="3" required></textarea></div>
            `,
            copy_record: `
                <div class="form-group"><label>班級名稱</label><input type="text" name="copy_class" class="form-control" required></div>
                <div class="form-group"><label>授課老師</label><input type="text" name="copy_teacher" class="form-control" required></div>
                <div class="form-group"><label>講義內容</label><input type="text" name="copy_content" class="form-control" required></div>
                <div class="form-group"><label>影印類型</label><select name="copy_color" class="form-control" required><option value="black_white">黑白</option><option value="color">彩色</option></select></div>
                <div class="form-group"><label>總張數</label><input type="number" name="copy_pages" class="form-control" required min="1"></div>
            `,
            data_access: `
                <div class="form-group"><label>調閱對象類型</label><select name="data_target_type" class="form-control" required><option value="student">學生資料</option><option value="parent">家長資料</option><option value="employee">員工資料</option></select></div>
                <div class="form-group"><label>調閱範圍說明</label><input type="text" name="data_scope" class="form-control" placeholder="例如：2023年秋季班全體學生成績" required></div>
                <div class="form-group"><label>調閱目的 (需符合個資法)</label><textarea name="data_purpose" class="form-control" rows="3" required></textarea></div>
                <div class="form-group"><label><input type="checkbox" name="data_compliance" required> 本人承諾遵守個人資料保護法，調閱資料僅供公務使用，絕不外洩。</label></div>
            `
        };

        async function loadUserOptions() {
            try {
                const response = await fetch('/api/users/list/basic');
                const result = await response.json();
                const select = document.getElementById('substituteSelect');
                if (select && result.success) {
                    select.innerHTML = '<option value="">請選擇代理人...</option>';
                    const roleMap = { 'EMPLOYEE': '一般員工', 'MANAGER': '單位主管', '櫃檯主任': '櫃檯主任', 'DIRECTOR': '管理部主任', 'CISO': '資安長', 'PRINCIPAL': '班主任' };
                    result.data.forEach(u => {
                        select.innerHTML += `<option value="${u.id}:${u.name}">${u.name} (${roleMap[u.role] || u.role})</option>`;
                    });
                }
            } catch (e) { console.error('讀取名單失敗'); }
        }

        function renderFormFields() {
            const type = document.getElementById('formTypeSelector').value;
            const container = document.getElementById('dynamicFieldsContainer');
            if (type && formTemplates[type]) {
                container.innerHTML = formTemplates[type];
                container.style.display = 'block';
                if (type === 'leave') loadUserOptions();
            } else {
                container.style.display = 'none';
                container.innerHTML = '';
            }
        }

        document.getElementById('applyForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const userStr = localStorage.getItem('currentUser');
            if (!userStr) { alert('登入狀態已失效，請重新登入。'); window.location.href = '/'; return; }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '表單傳送中，請稍候... ⏳';
            submitBtn.style.backgroundColor = '#7A8B9A';

            try {
                const user = JSON.parse(userStr);
                const formType = document.getElementById('formTypeSelector').value;

                const formData = new FormData(this);
                formData.append('formType', formType);
                formData.append('userId', user.id);

                const response = await fetch('/api/forms/apply', { method: 'POST', body: formData });
                const result = await response.json();

                if (result.success) {
                    alert('表單與附件送出成功！已進入簽核流程。');
                    window.location.href = '/dashboard';
                } else {
                    alert('送出失敗：' + result.error);
                    submitBtn.disabled = false;
                    submitBtn.textContent = '送出申請單 ➔';
                    submitBtn.style.backgroundColor = 'var(--primary-color)';
                }
            } catch (err) {
                alert('系統發生錯誤，無法連線至伺服器。');
                submitBtn.disabled = false;
                submitBtn.textContent = '送出申請單 ➔';
                submitBtn.style.backgroundColor = 'var(--primary-color)';
            }
        });
    </script>
</body>

</html>
