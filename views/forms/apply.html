<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行政申請系統 | 填寫表單</title>
    <style>
        /* (這裡的 CSS 完全沒有變動，保持您原本的完美設計) */
        :root {
            --primary-color: #0F4C81;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #334155;
            --text-light: #64748B;
            --border-color: #E2E8F0;
            --input-focus: #BAE6FD;
            --radius-md: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .form-selector {
            margin-bottom: 25px;
        }

        .form-selector select {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid var(--primary-color);
            border-radius: var(--radius-md);
            color: var(--primary-color);
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .dynamic-form {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .dynamic-form.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0c3e6a;
        }

        .file-upload-hint {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 5px;
        }

        /* 增加一個返回大廳的按鈕樣式 */
        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }

        .btn-back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <a href="/dashboard" class="btn-back">⬅ 返回大廳</a>
        <h2>新增申請單</h2>

        <div class="form-selector">
            <select id="formTypeSelector" onchange="switchForm()">
                <option value="payment">請款申請</option>
                <option value="leave">請假申請</option>
                <option value="seal">用印申請</option>
                <option value="procurement">採購申請</option>
                <option value="cash_withdraw">現金提領申請</option>
                <option value="copy_record">影印登記</option>
                <option value="data_access">個資調閱申請</option>
            </select>
        </div>

        <form id="mainApplicationForm">
            <div id="payment-form" class="dynamic-form active">
                <div class="row">
                    <div class="form-group"><label>請款金額 (NT$)</label><input type="number" name="payment_amount"
                            placeholder="例如: 1500" min="0"></div>
                    <div class="form-group"><label>受款人/廠商名稱</label><input type="text" name="payee_name"
                            placeholder="請輸入廠商名稱"></div>
                </div>
                <div class="form-group"><label>請款事由說明</label><textarea name="payment_reason"
                        placeholder="請詳細說明請款用途（如：購買A4影印紙兩箱）"></textarea></div>
                <div class="form-group"><label>上傳收據/發票影像</label><input type="file" name="receipt_image"
                        accept="image/*,application/pdf">
                    <div class="file-upload-hint">支援 JPG, PNG 格式。後續可點擊縮圖開啟燈箱預覽。</div>
                </div>
            </div>

            <div id="leave-form" class="dynamic-form">
                <div class="row">
                    <div class="form-group">
                        <label>假別</label>
                        <select name="leave_type">
                            <option value="annual">特休/年假</option>
                            <option value="sick">病假</option>
                            <option value="personal">事假</option>
                            <option value="official">公假</option>
                        </select>
                    </div>
                    <div class="form-group"><label>代理人</label><input type="text" name="substitute"
                            placeholder="請輸入職務代理人"></div>
                </div>
                <div class="row">
                    <div class="form-group"><label>起始時間</label><input type="datetime-local" name="leave_start"></div>
                    <div class="form-group"><label>結束時間</label><input type="datetime-local" name="leave_end"></div>
                </div>
                <div class="form-group"><label>請假事由</label><textarea name="leave_reason"
                        placeholder="請簡述請假原因"></textarea></div>
            </div>

            <div id="seal-form" class="dynamic-form">
                <div class="form-group"><label>文件名稱</label><input type="text" name="document_name"
                        placeholder="例如：與ＯＯ公司之合作備忘錄"></div>
                <div class="row">
                    <div class="form-group">
                        <label>印信種類</label>
                        <select name="seal_type">
                            <option value="company">公司大章</option>
                            <option value="representative">負責人小章</option>
                            <option value="both">大小章</option>
                            <option value="contract">合約專用章</option>
                        </select>
                    </div>
                    <div class="form-group"><label>用印份數</label><input type="number" name="seal_copies" value="1"
                            min="1"></div>
                </div>
                <div class="form-group"><label>用印事由與文件摘要</label><textarea name="seal_reason"
                        placeholder="請說明合約/文件之重點內容"></textarea></div>
                <div class="form-group"><label>上傳文件電子檔 (供主管審閱)</label><input type="file" name="document_file"
                        accept="application/pdf"></div>
            </div>

            <div id="procurement-form" class="dynamic-form">
                <div class="row">
                    <div class="form-group"><label>物品名稱</label><input type="text" name="item_name"
                            placeholder="例如：A4 影印紙"></div>
                    <div class="form-group"><label>預估總金額 (NT$)</label><input type="number" name="estimated_cost"
                            placeholder="請輸入預估花費" min="0"></div>
                </div>
                <div class="row">
                    <div class="form-group"><label>數量</label><input type="number" name="quantity" value="1" min="1">
                    </div>
                    <div class="form-group"><label>參考網址/供應商</label><input type="text" name="supplier_link"
                            placeholder="貼上商品連結或廠商名稱"></div>
                </div>
                <div class="form-group"><label>採採購原因與規格說明</label><textarea name="procurement_reason"
                        placeholder="請詳細說明為什麼需要採購此物品，以及相關規格限制"></textarea></div>
            </div>

            <div id="cash_withdraw-form" class="dynamic-form">
                <div class="row">
                    <div class="form-group"><label>提領金額 (NT$)</label><input type="number" name="withdraw_amount"
                            placeholder="例如: 5000" min="1"></div>
                    <div class="form-group"><label>預計提領日期</label><input type="date" name="withdraw_date"></div>
                </div>
                <div class="form-group"><label>提款用途說明</label><textarea name="withdraw_reason"
                        placeholder="請說明需提領現金之具體用途 (例如：發放講師車馬費、零用金備用)"></textarea></div>
            </div>

            <div id="copy_record-form" class="dynamic-form">
                <div class="row">
                    <div class="form-group"><label>影印類型</label><select name="copy_color">
                            <option value="black_white">黑白</option>
                            <option value="color">彩色</option>
                        </select></div>
                    <div class="form-group"><label>總張數</label><input type="number" name="copy_pages" placeholder="請輸入張數"
                            min="1"></div>
                </div>
                <div class="form-group"><label>歸屬專案 / 班級</label><input type="text" name="project_class"
                        placeholder="例如：國一數學秋季班講義"></div>
            </div>

            <div id="data_access-form" class="dynamic-form">
                <div class="form-group"
                    style="background-color: #FEF2F2; padding: 15px; border-left: 4px solid #EF4444; border-radius: 4px; margin-bottom: 20px;">
                    <span style="color: #B91C1C; font-size: 0.9rem; font-weight: bold;">⚠️
                        注意：此表單將直接呈報「資安長」進行簽核，請確保調閱行為符合個資法規範。</span>
                </div>
                <div class="row">
                    <div class="form-group"><label>調閱對象類別</label><select name="data_target_type">
                            <option value="student">學生個資</option>
                            <option value="parent">家長個資</option>
                            <option value="employee">員工個資</option>
                        </select></div>
                    <div class="form-group"><label>調閱範圍/條件</label><input type="text" name="data_scope"
                            placeholder="例如：2026年報名秋季班之學生名單"></div>
                </div>
                <div class="form-group"><label>調閱目的與用途</label><textarea name="data_purpose"
                        placeholder="請詳細說明為何需要調閱此資料？資料將用於何處？"></textarea></div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" name="data_compliance" required style="width: auto;">
                        <span style="font-weight: normal; font-size: 0.9rem;">我已了解並同意遵守公司資訊安全與個資保護規範，調閱之資料絕不外流。</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit">送出申請單 ➔</button>
        </form>
    </div>

    <script>
        // 處理表單切換與必填/停用屬性動態控制的邏輯
        function switchForm() {
            document.querySelectorAll('.dynamic-form').forEach(form => {
                form.classList.remove('active');

                // 把隱藏表單裡面的欄位全部設為 disabled，FormData 就不會收集它們
                form.querySelectorAll('input, select, textarea').forEach(input => {
                    input.disabled = true;
                });

                form.querySelectorAll('[required], [data-req="true"]').forEach(input => {
                    input.setAttribute('data-req', 'true');
                    input.removeAttribute('required');
                });
            });

            const selectedType = document.getElementById('formTypeSelector').value;
            const activeForm = document.getElementById(`${selectedType}-form`);

            if (activeForm) {
                activeForm.classList.add('active');

                // 把顯示中表單的欄位恢復啟用 (disabled = false)
                activeForm.querySelectorAll('input, select, textarea').forEach(input => {
                    input.disabled = false;
                });

                activeForm.querySelectorAll('[data-req="true"]').forEach(input => {
                    input.setAttribute('required', 'true');
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('currentUser');
            // 💡 防護機制：避免之前存到 "undefined" 導致崩潰
            if (!userStr || userStr === 'undefined') {
                alert('請先登入系統！');
                localStorage.removeItem('currentUser');
                window.location.href = '/';
                return;
            }
            switchForm();
        });

        // 處理表單送出事件 (支援檔案上傳)
        document.getElementById('mainApplicationForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // 抓取送出按鈕
            const submitBtn = this.querySelector('.btn-submit');
            const userStr = localStorage.getItem('currentUser');

            // 💡 再次確認登入狀態，防止崩潰
            if (!userStr || userStr === 'undefined') {
                alert('登入已失效，請重新登入！');
                localStorage.removeItem('currentUser');
                window.location.href = '/';
                return;
            }

            // 💡 體驗升級：按鈕變更為送出中，並禁用按鈕防止員工重複連點送出兩張單
            submitBtn.disabled = true;
            submitBtn.textContent = '表單傳送中，請稍候... ⏳';
            submitBtn.style.backgroundColor = '#7A8B9A';

            try {
                const user = JSON.parse(userStr);
                const formType = document.getElementById('formTypeSelector').value;

                // 使用 FormData 收集資料
                const formData = new FormData(this);
                formData.append('formType', formType);
                formData.append('userId', user.id);

                const response = await fetch('/api/forms/apply', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (result.success) {
                    alert('表單與附件送出成功！已進入簽核流程。');
                    window.location.href = '/dashboard';
                } else {
                    alert('送出失敗：' + result.error);
                    // 失敗時恢復按鈕狀態
                    submitBtn.disabled = false;
                    submitBtn.textContent = '送出申請單 ➔';
                    submitBtn.style.backgroundColor = 'var(--primary-color)';
                }
            } catch (err) {
                alert('系統發生錯誤，無法連線至伺服器。');
                console.error(err);
                // 失敗時恢復按鈕狀態
                submitBtn.disabled = false;
                submitBtn.textContent = '送出申請單 ➔';
                submitBtn.style.backgroundColor = 'var(--primary-color)';
            }
        });
    </script>
</body>

</html>
