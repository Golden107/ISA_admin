<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學達補習班行政簽核系統</title>
    <style>
        :root {
            --primary-color: #0F4C81;
            --primary-hover: #165b99;
            --bg-color: #F4F7F6;
            --text-main: #333;
            --text-muted: #7A8B9A;
            --input-border: #E2E8F0;
            --radius-md: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .error-message {
            color: #E53E3E;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>學達補習班行政簽核系統</h1>
            <p>請輸入您的員工帳號密碼</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">電子信箱 (帳號)</label>
                <input type="email" id="email" required placeholder="請輸入公司信箱">
            </div>
            <div class="form-group">
                <label for="password">系統密碼</label>
                <input type="password" id="password" required placeholder="請輸入密碼">
            </div>
            <button type="submit" class="btn-submit">登入系統</button>
            <div id="errorMessage" class="error-message"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            // 隱藏錯誤提示訊息
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                const result = await response.json();

                if (result.success) {
                    // 處理資料相容性，確保取得使用者詳細資料
                    const userData = result.user || result.data;

                    if (!userData) {
                        throw new Error("伺服器未回傳有效的使用者資料");
                    }

                    // 將使用者資訊寫入本地儲存區 (Local Storage)
                    localStorage.setItem('currentUser', JSON.stringify(userData));

                    // 導向系統大廳頁面
                    window.location.href = result.redirect || '/dashboard';
                } else {
                    errorDiv.textContent = result.message || '登入失敗，帳號或密碼錯誤';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                console.error('前端請求失敗或資料異常：', err);
                errorDiv.textContent = err.message || '系統連線錯誤，請確認伺服器狀態。';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
