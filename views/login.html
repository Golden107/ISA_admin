<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>補教行政系統 | 登入</title>
    <style>
        :root {
            --primary-color: #0F4C81;
            --primary-hover: #165b99;
            --bg-color: #F4F7F6;
            --text-main: #333;
            --text-muted: #7A8B9A;
            --input-border: #E2E8F0;
            --radius-md: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
        }

        #error-message {
            color: #E53E3E;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-header">
            <h1>企業行政管理系統</h1>
            <p>請輸入您的員工帳號密碼登入</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">員工信箱</label>
                <input type="email" id="email" required placeholder="name@company.com">
            </div>
            <div class="form-group">
                <label for="password">登入密碼</label>
                <input type="password" id="password" required placeholder="請輸入密碼">
            </div>
            <button type="submit" class="btn-login">登入系統</button>
            <div id="error-message"></div>
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 💡 修正 1：正確抓取顯示錯誤訊息的 div
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'none'; // 每次送出前先隱藏錯誤訊息

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                const result = await response.json();
                console.log("後端回傳的資料：", result); // 幫助你在開發者工具看後端到底傳了什麼

                if (result.success) {
                    // 💡 修正 2：相容 result.user 或 result.data，並確保有抓到東西
                    const userData = result.user || result.data;

                    if (!userData) {
                        throw new Error("後端沒有回傳使用者詳細資料 (user/data 欄位為空)");
                    }

                    // 確保資料存在才存入 localStorage
                    localStorage.setItem('currentUser', JSON.stringify(userData));

                    // 導向大廳 (如果後端沒給 redirect 網址，預設去 /dashboard)
                    window.location.href = result.redirect || '/dashboard';
                } else {
                    errorDiv.textContent = result.message || '登入失敗，帳號或密碼錯誤';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                console.error('前端請求失敗或資料異常：', err);
                errorDiv.textContent = err.message || '系統連線錯誤，請確認伺服器已啟動。';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
